[package]
name = "texmake-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "texmake"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"

[dev-dependencies]
assert_cmd = "2"
criterion = "0.8.2"
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
