[package]
name = "texmake-rs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "texmake"
path = "src/main.rs"

[lib]
name = "texmake"
path = "src/lib.rs"

[[bench]]
name = "vars"
harness = false

[[bench]]
name = "config"
harness = false

[[bench]]
name = "scan"
harness = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
inquire = "0.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"

[dev-dependencies]
assert_cmd = "2"
criterion = "0.8.2"
serde_json = "1"
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
